<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title.search">Buscar — Warframe Farm Helper</title>
  <meta name="description" content="Busca unificada: itens, componentes, relíquias, FAQ e guias — com fallback para os sites confiáveis da comunidade Warframe.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-head" id="site-header"></header>

  <main>
    <div class="wrap">
      <section class="hero" style="padding-top:14px">
        <form class="console-wrap" id="search-form" role="search">
          <div class="console">
            <input id="q" type="search" data-i18n-ph="search.placeholderBig" autocomplete="off" aria-label="Buscar">
            <button type="submit" data-i18n="search.button">Buscar</button>
          </div>
          <div class="suggest" id="suggest" role="listbox" hidden></div>
        </form>
      </section>

      <p class="muted" id="summary" aria-live="polite"></p>

      <section class="panel panel-quiet" id="local-panel" hidden>
        <p class="eyebrow" data-i18n="search.localResults">Resultados locais</p>
        <ul class="rowlist" id="local-list"></ul>
      </section>

      <section class="panel" id="web-panel" hidden>
        <p class="eyebrow"><span data-i18n="search.extResults">Resultados externos</span> <span class="hint" data-i18n="search.extHint">sites confiáveis da comunidade</span></p>
        <p class="web-note" id="web-note"></p>
        <ul class="rowlist" id="web-list"></ul>
      </section>

      <p id="web-more-wrap" hidden class="panel-cta">
        <button class="btn-line" id="web-more" type="button" data-i18n="search.alsoWeb">Buscar também na web</button>
      </p>
    </div>
  </main>

  <footer class="site-foot" id="site-footer"></footer>

  <script src="/js/i18n.js"></script>
  <script src="/js/latest.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/cycles.js"></script>
  <script src="/js/buscar.js"></script>
</body>
</html>
