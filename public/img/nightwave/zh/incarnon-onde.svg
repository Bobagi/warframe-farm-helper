<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 478" width="400" height="478" role="img" aria-label="拿到灵化武器的三条路" font-family="'Exo 2','Segoe UI',Roboto,Helvetica,Arial,'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif">
<rect width="400" height="478" fill="#0b0e17"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#cfae66"/></marker></defs>
<text x="20" y="28" font-size="14" fill="#cfae66" font-weight="700" text-anchor="start" letter-spacing="0">一把灵化武器都没有</text>
<text x="20" y="48" font-size="12" fill="#6b7590" font-weight="400" text-anchor="start" letter-spacing="0">三条路，从最省钱到最快</text>
<path d="M20 66 H370 L380 76 V160 H20 Z" fill="#151b2c" stroke="#232c42" stroke-width="1"/>
<rect x="20" y="66" width="3" height="94" fill="#6ee7f2"/>
<text x="34" y="90" font-size="13.5" fill="#6ee7f2" font-weight="700" text-anchor="start" letter-spacing="0">1 · 钢铁之路的回路</text>
<text x="34" y="112" font-size="12.5" fill="#9aa5bc" font-weight="400" text-anchor="start" letter-spacing="0">都瓦丽：每周 2 个转化器，在第 5 和</text>
<text x="34" y="128" font-size="12.5" fill="#9aa5bc" font-weight="400" text-anchor="start" letter-spacing="0">第 10 个奖励位。9 周一轮换。</text>
<text x="34" y="144" font-size="12.5" fill="#9aa5bc" font-weight="400" text-anchor="start" letter-spacing="0">需要《都瓦丽悖论》+ 钢铁之路。</text>
<path d="M42 165 L42 177" stroke="#cfae66" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M20 182 H370 L380 192 V276 H20 Z" fill="#151b2c" stroke="#232c42" stroke-width="1"/>
<rect x="20" y="182" width="3" height="94" fill="#6ee7f2"/>
<text x="34" y="206" font-size="13.5" fill="#6ee7f2" font-weight="700" text-anchor="start" letter-spacing="0">2 · 扎里曼的 Cavalero</text>
<text x="34" y="228" font-size="12.5" fill="#9aa5bc" font-weight="400" text-anchor="start" letter-spacing="0">Phenmor、Laetum、Felarx 等本身就是</text>
<text x="34" y="244" font-size="12.5" fill="#9aa5bc" font-weight="400" text-anchor="start" letter-spacing="0">灵化武器。需要《扎里曼的天使》</text>
<text x="34" y="260" font-size="12.5" fill="#9aa5bc" font-weight="400" text-anchor="start" letter-spacing="0">以及段位 14。</text>
<path d="M42 281 L42 293" stroke="#cfae66" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M20 298 H370 L380 308 V376 H20 Z" fill="#151b2c" stroke="#232c42" stroke-width="1"/>
<rect x="20" y="298" width="3" height="78" fill="#cfae66"/>
<text x="34" y="322" font-size="13.5" fill="#cfae66" font-weight="700" text-anchor="start" letter-spacing="0">3 · 白金捷径</text>
<text x="34" y="344" font-size="12.5" fill="#9aa5bc" font-weight="400" text-anchor="start" letter-spacing="0">Cavalero 每周卖 1 个转化器，</text>
<text x="34" y="360" font-size="12.5" fill="#9aa5bc" font-weight="400" text-anchor="start" letter-spacing="0">120 白金，安装用的材料也一起给。</text>
<path d="M20 392 H370 L380 402 V460 H20 Z" fill="#111624" stroke="rgba(207,174,102,0.42)" stroke-width="1"/>
<text x="34" y="414" font-size="11.5" fill="#e8ce8f" font-weight="700" text-anchor="start" letter-spacing="0">近战也算，但会拖慢你</text>
<text x="34" y="434" font-size="12.5" fill="#9aa5bc" font-weight="400" text-anchor="start" letter-spacing="0">近战灵化形态持续 180 秒且无法取消：</text>
<text x="34" y="451" font-size="12.5" fill="#9aa5bc" font-weight="400" text-anchor="start" letter-spacing="0">激活 5 次就是干等 15 分钟。</text>
</svg>
