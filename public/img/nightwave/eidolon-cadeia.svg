<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 564" width="400" height="564" role="img" aria-label="A cadeia do Tridolon: Teralyst, Gantulyst e Hydrolyst" font-family="'Exo 2','Segoe UI',Roboto,Helvetica,Arial,'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif">
<rect width="400" height="564" fill="#0b0e17"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#cfae66"/></marker></defs>
<text x="20" y="28" font-size="14" fill="#cfae66" font-weight="700" text-anchor="start" letter-spacing="0.10em">A CADEIA DO TRIDOLON</text>
<text x="20" y="48" font-size="12" fill="#6b7590" font-weight="400" text-anchor="start" letter-spacing="0">o Hidrolista é o último elo</text>
<path d="M20 66 H370 L380 76 V158 H20 Z" fill="#151b2c" stroke="#232c42" stroke-width="1"/>
<rect x="20" y="66" width="3" height="92" fill="#6ee7f2"/>
<text x="34" y="90" font-size="14.5" fill="#6ee7f2" font-weight="700" text-anchor="start" letter-spacing="0">1 · TERALYST</text>
<text x="34" y="108" font-size="11.5" fill="#6b7590" font-weight="400" text-anchor="start" letter-spacing="0">nível 50 · 4 sinóvias</text>
<text x="34" y="128" font-size="12.5" fill="#9aa5bc" font-weight="400" text-anchor="start" letter-spacing="0">CAPTURE com 2 lures carregados.</text>
<text x="34" y="144" font-size="12.5" fill="#9aa5bc" font-weight="400" text-anchor="start" letter-spacing="0">Só a captura solta o fragmento Brilhante.</text>
<path d="M42 166 L42 210" stroke="#cfae66" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="56" y="182" font-size="12" fill="#cfae66" font-weight="400" text-anchor="start" letter-spacing="0">ofereça o fragmento BRILHANTE</text>
<text x="56" y="197" font-size="12" fill="#cfae66" font-weight="400" text-anchor="start" letter-spacing="0">no santuário do lago Gara Toht</text>
<path d="M20 218 H370 L380 228 V310 H20 Z" fill="#151b2c" stroke="#232c42" stroke-width="1"/>
<rect x="20" y="218" width="3" height="92" fill="#6ee7f2"/>
<text x="34" y="242" font-size="14.5" fill="#6ee7f2" font-weight="700" text-anchor="start" letter-spacing="0">2 · GANTULYST</text>
<text x="34" y="260" font-size="11.5" fill="#6b7590" font-weight="400" text-anchor="start" letter-spacing="0">nível 55 · 6 sinóvias</text>
<text x="34" y="280" font-size="12.5" fill="#9aa5bc" font-weight="400" text-anchor="start" letter-spacing="0">CAPTURE com 3 lures carregados.</text>
<text x="34" y="296" font-size="12.5" fill="#9aa5bc" font-weight="400" text-anchor="start" letter-spacing="0">Só a captura solta o fragmento Radiante.</text>
<path d="M42 318 L42 362" stroke="#cfae66" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="56" y="334" font-size="12" fill="#cfae66" font-weight="400" text-anchor="start" letter-spacing="0">ofereça o fragmento RADIANTE</text>
<text x="56" y="349" font-size="12" fill="#cfae66" font-weight="400" text-anchor="start" letter-spacing="0">no mesmo santuário</text>
<path d="M20 370 H370 L380 380 V462 H20 Z" fill="#151b2c" stroke="#232c42" stroke-width="1"/>
<rect x="20" y="370" width="3" height="92" fill="#e8ce8f"/>
<text x="34" y="394" font-size="14.5" fill="#e8ce8f" font-weight="700" text-anchor="start" letter-spacing="0">3 · HYDROLYST</text>
<text x="34" y="412" font-size="11.5" fill="#6b7590" font-weight="400" text-anchor="start" letter-spacing="0">nível 60 · 6 sinóvias</text>
<text x="34" y="432" font-size="12.5" fill="#9aa5bc" font-weight="400" text-anchor="start" letter-spacing="0">Aqui MATAR já fecha o ato.</text>
<text x="34" y="448" font-size="12.5" fill="#9aa5bc" font-weight="400" text-anchor="start" letter-spacing="0">Capturar só aumenta o prêmio.</text>
<path d="M20 478 H370 L380 488 V546 H20 Z" fill="#111624" stroke="rgba(207,174,102,0.42)" stroke-width="1"/>
<text x="34" y="500" font-size="11.5" fill="#e8ce8f" font-weight="700" text-anchor="start" letter-spacing="0.10em">SEM CAPTURA A CORRENTE PARA</text>
<text x="34" y="520" font-size="12.5" fill="#9aa5bc" font-weight="400" text-anchor="start" letter-spacing="0">Matar o Teralyst sem lure carregado</text>
<text x="34" y="537" font-size="12.5" fill="#9aa5bc" font-weight="400" text-anchor="start" letter-spacing="0">encerra a noite ali mesmo.</text>
</svg>
